<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
    <iframe id="preview" sandbox="allow-scripts allow-forms allow-modals" title="代码预览"></iframe>
    <script>
// This file has its own CSP. User code runs in a second iframe with an opaque origin.
const preview = document.getElementById('preview');
window.addEventListener('message', event => {
    if (event.source === window.parent && event.data?.type === 'sandbox-render') {
        preview.srcdoc = String(event.data.html || '');
    } else if (event.source === preview.contentWindow &&
        ['sandbox-console', 'sandbox-error'].includes(event.data?.type)) {
        window.parent.postMessage(event.data, '*');
    }
});
window.parent.postMessage({ type: 'sandbox-ready' }, '*');

    </script>
</body>
</html>
