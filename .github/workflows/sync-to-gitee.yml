name: Sync GitHub to Gitee

on:
  push:
    branches: ["**"]
    # 注意：不监听 tags，避免与 release 事件重复触发
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  mirror:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Push to Gitee
        run: |
          git remote add gitee git@gitee.com:${{ secrets.GITEE_USER }}/${{ github.event.repository.name }}.git
          git push gitee --all
          

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Push release tag to Gitee
        run: |
          git remote add gitee git@gitee.com:${{ secrets.GITEE_USER }}/${{ github.event.repository.name }}.git
          git push gitee ${{ github.event.release.tag_name }} || echo "Tag may already exist on Gitee"

      - name: Download GitHub Release Assets
        run: |
          mkdir assets
          for url in $(echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[].browser_download_url'); do
            wget -P assets $url
          done

      - name: Delete Existing Gitee Release Assets
        run: |
          # 获取 Gitee 上该 Release 的所有附件 ID
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" \
            "https://gitee.com/api/v5/repos/${{ secrets.GITEE_USER }}/${{ github.event.repository.name }}/releases/tags/${{ github.event.release.tag_name }}")
          
          # 提取附件 ID 并删除
          echo "$RELEASE_INFO" | jq -r '.assets[].id' | while read asset_id; do
            if [ -n "$asset_id" ]; then
              curl -X DELETE -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" \
                "https://gitee.com/api/v5/repos/${{ secrets.GITEE_USER }}/${{ github.event.repository.name }}/releases/assets/${asset_id}" || true
            fi
          done

      - name: Create/Update Gitee Release and Upload Assets
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: ${{ secrets.GITEE_USER }}
          gitee_repo: ${{ github.event.repository.name }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.event.release.tag_name }}
          gitee_release_name: ${{ github.event.release.name }}
          gitee_release_body: ${{ github.event.release.body }}
          gitee_target_commitish: master
          gitee_upload_retry_times: 3
          gitee_files: |
            assets/*