<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-in-One: All-in-One AI Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Marked.js & DOMPurify for secure Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>

    <!-- Highlight.js for Code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="index.css">
</head>

<body class="light-theme">
    <!-- Custom Drag Region for borderless window -->
    <div class="titlebar-drag-region">
        <span class="app-title">Chat-in-One</span>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="btn btn-primary btn-block" title="新对话 (Ctrl+N)"
                    style="margin-bottom: 8px;">
                    <i class="ph ph-plus-circle"></i> 新的对话
                </button>
                <div style="display: flex; gap: 8px;">
                    <button id="export-chats-btn" class="btn btn-ghost" style="flex: 1; font-size: 12px; padding: 6px;"
                        title="导出对话记录">
                        <i class="ph ph-export"></i> 导出
                    </button>
                    <button id="import-chats-btn" class="btn btn-ghost" style="flex: 1; font-size: 12px; padding: 6px;"
                        title="导入对话记录">
                        <i class="ph ph-import"></i> 导入
                    </button>
                    <!-- Hidden file input for import -->
                    <input type="file" id="import-file-input" accept=".json" style="display: none;">
                </div>
            </div>

            <div class="chat-list" id="chat-list">
                <!-- Chat history items will be injected here -->
            </div>

            <div class="sidebar-footer">
                <button id="settings-btn" class="btn btn-ghost btn-block text-left">
                    <i class="ph ph-gear"></i> 设置
                </button>
            </div>
        </aside>

        <!-- Sidebar Resizer -->
        <div class="sidebar-resizer" id="sidebar-resizer"></div>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="chat-title" id="current-chat-title" style="flex: 1;">新建对话</div>
            </header>

            <div class="message-container" id="message-container">
                <div class="welcome-screen" id="welcome-screen">
                    <div class="logo-circle"><i class="ph ph-robot"></i></div>
                    <h1>您好，我是您的 AI 助理</h1>
                    <p>请点击左下角「设置」配置 API 以开始使用。</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <!-- Row 1: Input and Send -->
                    <div class="input-row-main">
                        <textarea id="message-input" placeholder="输入消息，或 Shift + Enter 换行..." rows="1"
                            autofocus></textarea>
                        <button id="send-btn" class="btn btn-icon btn-send" title="发送 (Enter)">
                            <i class="ph-fill ph-paper-plane-right"></i>
                        </button>
                    </div>

                    <!-- Row 2: Tools and Model Selection -->
                    <div class="input-row-tools">
                        <div class="tools-left">
                            <button class="tool-btn" title="上传图片"><i class="ph ph-image-square"></i></button>
                            <button class="tool-btn" title="MCP 工具盒"><i class="ph ph-command"></i></button>
                            <button class="tool-btn" title="集成知识库"><i class="ph ph-books"></i></button>
                        </div>
                        <div class="tools-right">
                            <select id="current-model-select" title="切换模型">
                                <option value="">等待配置</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Full-Page Overlay -->
    <div class="settings-page" id="settings-modal" style="display: none;">
        <div class="settings-page-header">
            <div class="settings-page-title">
                <i class="ph ph-gear"></i>
                <h2>设置</h2>
            </div>
            <div class="settings-page-actions">
                <button type="button" class="btn btn-ghost" id="cancel-settings-btn">取消</button>
                <button type="submit" form="settings-form" class="btn btn-primary" id="save-settings-btn">
                    <i class="ph ph-floppy-disk"></i> 保存并应用
                </button>
                <button class="btn btn-icon btn-ghost" id="close-settings-btn" title="关闭">
                    <i class="ph ph-x"></i>
                </button>
            </div>
        </div>

        <div class="settings-page-body">
            <div class="settings-nav">
                <div class="settings-tab active" data-tab="tab-general">
                    <i class="ph ph-sliders"></i>
                    <span>常规设置</span>
                </div>
                <div class="settings-tab" data-tab="tab-providers">
                    <i class="ph ph-cloud"></i>
                    <span>模型服务商</span>
                </div>
            </div>

            <div class="settings-panel">
                <form id="settings-form">

                    <!-- General Tab -->
                    <div id="tab-general" class="tab-pane active">
                        <div class="settings-section-title">常规设置</div>
                        <div class="form-group">
                            <label for="system-prompt">全局系统角色设定 (System Prompt)</label>
                            <textarea id="system-prompt" rows="5" placeholder="你是一个智能、高效且有帮助的助理。"></textarea>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" id="enable-thinking" checked
                                style="width: 16px; height: 16px; flex-shrink: 0;">
                            <label for="enable-thinking" style="margin-bottom: 0; cursor: pointer;">
                                显示模型的思考过程
                                <span
                                    style="color: var(--text-muted); font-size: 12px; display: block; margin-top: 2px;">针对支持
                                    reasoning 的模型（如 DeepSeek-R1）有效</span>
                            </label>
                        </div>
                    </div>

                    <!-- Providers Tab -->
                    <div id="tab-providers" class="tab-pane">
                        <div class="providers-master-detail">
                            <div class="providers-sidebar">
                                <div class="sidebar-header-row">
                                    <span>服务商列表</span>
                                    <button type="button" id="add-provider-btn" class="btn btn-icon btn-ghost btn-sm"
                                        title="添加服务商">
                                        <i class="ph ph-plus"></i>
                                    </button>
                                </div>
                                <div id="providers-list-menu">
                                    <!-- List of providers will be injected here -->
                                </div>
                            </div>
                            <div class="provider-detail-view" id="provider-detail-container">
                                <div class="empty-state">
                                    <i class="ph ph-selection-plus"></i>
                                    <p>请从左侧选择一个服务商，或点击添加按钮</p>
                                </div>
                                <!-- Selected provider settings will be rendered here -->
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
